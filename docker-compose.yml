services:

  app:
    image: 2xandrade/aep6s-banco-alimentos:primeira_entrega
    container_name: aep-banco-alimentos
    stdin_open: true
    tty: true
    environment:
      MONGO_URI: mongodb://mongodb:27017
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: aep-mongo
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
